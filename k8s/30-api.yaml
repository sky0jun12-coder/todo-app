apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: todo-app
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: todo-app
spec:
  # 시작할 때 마이그레이션을 적용하므로 여러 개로 늘리기 전에 마이그레이션을 분리해야 한다.
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: todo-app-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
          startupProbe:
            tcpSocket:
              port: 4000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          # /api/health는 DB까지 확인한다. DB 장애로 API가 재시작되지 않도록 준비 프로브에만 쓴다.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
