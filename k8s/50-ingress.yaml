apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app
  namespace: todo-app
spec:
  ingressClassName: traefik
  rules:
    # host를 지정해 다른 이름의 요청을 가로채지 않는다. (실습은 없는 이름에 404를 기대한다)
    - host: localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
