# DB 비밀번호를 제외한 설정. 비밀번호는 Secret db-secret에 있으며 이 저장소에 두지 않는다.
# kubectl -n todo-app create secret generic db-secret --from-env-file=<(echo "DB_PASSWORD=...")
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: todo-app
data:
  DB_HOST: db
  DB_PORT: "5432"
  DB_USER: todo_app
  DB_NAME: todo_app
  API_PORT: "4000"
  COOKIE_SECURE: "false"
---
# 클러스터에서는 Ingress가 /api를 API로 보내므로 웹은 화면 파일만 제공한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx
  namespace: todo-app
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri.html $uri/ =404;
        }
    }
