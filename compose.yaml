# DB 접속정보는 같은 폴더의 .env에서 읽는다. (git에 올리지 않는다)
# 값이 없으면 시작하지 않는다.
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 이 컴퓨터에서만 접속할 수 있다.
      - "127.0.0.1:${DOCKER_WEB_PORT:-8090}:80"
    networks:
      - frontend
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      # 주소와 포트는 컨테이너 네트워크 기준이므로 .env의 값을 쓰지 않는다.
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?.env에 DB_USER가 필요합니다}
      DB_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD가 필요합니다}
      DB_NAME: ${DB_NAME:?.env에 DB_NAME이 필요합니다}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?.env에 DB_USER가 필요합니다}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD가 필요합니다}
      POSTGRES_DB: ${DB_NAME:?.env에 DB_NAME이 필요합니다}
    volumes:
      # PostgreSQL 18 이미지는 데이터를 이 경로 아래 버전별 폴더에 저장한다.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
    restart: unless-stopped

networks:
  # 웹은 API까지만, DB는 API에서만 접근할 수 있다.
  frontend:
  backend:

volumes:
  db-data:
